# Keep the free Render instance from spinning down.
#
# Render's free tier sleeps the API after 15 idle minutes and takes ~50 seconds
# to wake, which is a broken first page load for every visitor after a quiet
# spell — and a stalled scanner at the door. Hitting /api/health/ every ten
# minutes keeps it warm. That endpoint runs SELECT 1, so the same ping keeps
# the free Supabase project from pausing for inactivity too.
#
# This is a workaround, not a fix. Render's Starter plan removes the spin-down
# outright (see the `plan` comment in render.yaml) — use it for event week.
#
# Two limits to know about:
#   - GitHub runs schedules late under load; ten minutes can drift to twenty.
#   - GitHub disables the schedule after 60 days without a push. A commit
#     re-enables it.

name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  # Lets you trigger it by hand from the Actions tab to confirm it works.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit the health endpoint
        # --max-time is generous on purpose: if the instance has already gone
        # to sleep, this request is the one that wakes it, and that takes a
        # while. --fail turns a 5xx into a red run so a broken deploy shows
        # up in the Actions tab rather than being silently "pinged".
        run: |
          curl --fail --silent --show-error --max-time 90 \
            https://tedxumtbackend.onrender.com/api/health/
